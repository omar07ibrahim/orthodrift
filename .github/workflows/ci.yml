name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Run tests with coverage
        run: >-
          python -m pytest -q --cov=orthodrift --cov-report=term-missing
          --cov-fail-under=90

  compatibility:
    name: Compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -q

  wheel:
    name: Wheel / clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel and its offline dependency set
        run: python -m pip wheel --wheel-dir dist .
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/orthodrift-smoke"
          "$RUNNER_TEMP/orthodrift-smoke/bin/pip" install \
            --no-index --find-links dist orthodrift
      - name: Exercise the installed CLI
        run: |
          "$RUNNER_TEMP/orthodrift-smoke/bin/orthodrift" --help >/dev/null
          "$RUNNER_TEMP/orthodrift-smoke/bin/orthodrift" run \
            examples/shaki-rank-flip.json --output "$RUNNER_TEMP/shaki.jsonl"
          "$RUNNER_TEMP/orthodrift-smoke/bin/orthodrift" verify \
            "$RUNNER_TEMP/shaki.jsonl"
      - name: Check installed metadata and typing marker
        run: >-
          "$RUNNER_TEMP/orthodrift-smoke/bin/python" -c
          "import importlib.metadata, importlib.resources, orthodrift;
          assert orthodrift.__version__ == importlib.metadata.version('orthodrift');
          assert importlib.resources.files('orthodrift').joinpath('py.typed').is_file()"
