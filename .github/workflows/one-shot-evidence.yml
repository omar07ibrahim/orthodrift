name: One-shot evidence adoption

on:
  push:
    branches: ["codex/portfolio-evidence"]

permissions:
  contents: write

concurrency:
  group: orthodrift-one-shot-evidence
  cancel-in-progress: true

jobs:
  adopt:
    if: ${{ github.event.head_commit.message != 'Adopt generated OrthoDrift evidence' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONTAINER_IMAGE: mcr.microsoft.com/playwright/python@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/portfolio-evidence
      - name: Set up exact experiment runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"
      - name: Install locked application and build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.6"
          python -m pip install --require-hashes -r requirements/quality.txt
          python -m pip install --no-build-isolation --no-deps .
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
      - name: Build real CLI, artifact, and report inputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(git log -1 --format=%H -- examples pyproject.toml requirements/runtime.in requirements/runtime.txt requirements/evidence-browser-image.lock.json requirements/evidence-browser.txt src tools/capture_evidence.py)"
          SOURCE_TREE="$(git rev-parse "$SOURCE_REVISION^{tree}")"
          for value in "$SOURCE_REVISION" "$SOURCE_TREE"; do
            test "$(printf '%s' "$value" | wc -c)" -eq 40
            case "$value" in *[!0-9a-f]*) exit 1;; esac
          done
          echo "SOURCE_REVISION=$SOURCE_REVISION" >>"$GITHUB_ENV"
          echo "SOURCE_TREE=$SOURCE_TREE" >>"$GITHUB_ENV"

          input="$RUNNER_TEMP/orthodrift-input"
          mkdir -m 700 "$input"
          cp examples/shaki-rank-flip.json "$input/case.json"
          (
            cd "$input"
            {
              echo '$ orthodrift run case.json --output shaki.jsonl'
              orthodrift run case.json --output shaki.jsonl
              echo
              echo '$ orthodrift verify shaki.jsonl'
              orthodrift verify shaki.jsonl
              echo
              echo '$ orthodrift report shaki.jsonl --output report.html'
              orthodrift report shaki.jsonl --output report.html
            } >shaki-cli.txt
          )
          python tools/capture_evidence.py prepare             --root "$GITHUB_WORKSPACE"             --artifact "$input/shaki.jsonl"             --report "$input/report.html"             --cli "$input/shaki-cli.txt"             --output-root "$RUNNER_TEMP/orthodrift-evidence"
      - name: Set up exact evidence wheel downloader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Download hash-locked browser wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/evidence-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all:             --dest "$RUNNER_TEMP/evidence-wheelhouse"             -r requirements/evidence-browser.txt
          test "$(find "$RUNNER_TEMP/evidence-wheelhouse" -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Capture in platform-pinned browser without network
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$CONTAINER_IMAGE"
          test "$(docker image inspect "$CONTAINER_IMAGE" --format '{{.Architecture}}/{{.Os}}')" = "amd64/linux"
          docker run --rm             --platform linux/amd64             --pull=never             --network=none             --read-only             --cap-drop=ALL             --security-opt=no-new-privileges             --pids-limit=512             --memory=4g             --cpus=2             --shm-size=1g             --tmpfs /tmp:rw,exec,nosuid,nodev,size=2147483648             --user "$(id -u):$(id -g)"             --env HOME=/tmp/home             --env PYTHONNOUSERSITE=1             --env PYTHONPATH=/tmp/evidence-python             --volume "$GITHUB_WORKSPACE:/src:ro"             --volume "$RUNNER_TEMP/evidence-wheelhouse:/wheelhouse:ro"             --volume "$RUNNER_TEMP:/out:rw"             --entrypoint bash             "$CONTAINER_IMAGE"             -euo pipefail -c '
              mkdir -p "$HOME" /tmp/evidence-python
              python -m pip install --no-index --find-links=/wheelhouse --target=/tmp/evidence-python Pillow==12.3.0 playwright==1.62.0
              python /src/tools/capture_evidence.py capture --output-root /out/orthodrift-evidence --container-image "'"$CONTAINER_IMAGE"'"
              python /src/tools/capture_evidence.py verify-visuals --output-root /out/orthodrift-evidence
            '
      - name: Restore exact experiment runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"
      - name: Finalize and independently replay the bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/capture_evidence.py finalize             --root "$GITHUB_WORKSPACE"             --output-root "$RUNNER_TEMP/orthodrift-evidence"             --source-revision "$SOURCE_REVISION"             --source-tree "$SOURCE_TREE"             --container-image "$CONTAINER_IMAGE"             --browser "Chromium 151.0.7922.34"             --playwright "1.62.0"             --pillow "12.3.0"
          python tools/capture_evidence.py verify             --root "$GITHUB_WORKSPACE"             --output-root "$RUNNER_TEMP/orthodrift-evidence"             --source-revision "$SOURCE_REVISION"             --source-tree "$SOURCE_TREE"             --container-image "$CONTAINER_IMAGE"
          test "$(find "$RUNNER_TEMP/orthodrift-evidence/docs/evidence" -type f | wc -l)" -eq 13
          test -z "$(find "$RUNNER_TEMP/orthodrift-evidence" -type l -print -quit)"
      - name: Publish only verified evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/evidence
          cp -a "$RUNNER_TEMP/orthodrift-evidence/docs/evidence" docs/evidence
          git diff --check
          git config user.name "Omar Ibrahim"
          git config user.email "31526072+omar07ibrahim@users.noreply.github.com"
          git add -- docs/evidence
          test "$(git diff --cached --name-only | wc -l)" -ge 4
          test "$(git diff --cached --name-only | grep -Ev '^docs/evidence/' | wc -l)" -eq 0
          git diff --cached --name-only | grep -Fx docs/evidence/orthodrift-evidence.json
          GIT_AUTHOR_NAME="Omar Ibrahim"           GIT_AUTHOR_EMAIL="31526072+omar07ibrahim@users.noreply.github.com"           GIT_COMMITTER_NAME="Omar Ibrahim"           GIT_COMMITTER_EMAIL="31526072+omar07ibrahim@users.noreply.github.com"             git commit -m "Adopt generated OrthoDrift evidence"
          git push origin HEAD:refs/heads/codex/portfolio-evidence