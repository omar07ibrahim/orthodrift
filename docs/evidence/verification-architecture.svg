<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img">
<title>OrthoDrift verification architecture</title>
<desc>The artifact binds strict input validation, deterministic retrieval and reduction, runtime fingerprinting, exact replay, and offline reporting.</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5ee7f7"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#eaf2ff}.title{font-size:30px;font-weight:750}.sub{font-size:15px;fill:#91a8c7}.box{fill:#101f35;stroke:#2a3f5e}.name{font-size:17px;font-weight:800;fill:#ffad5c}.detail{font-size:11px;fill:#91a8c7}.arrow{stroke:#5ee7f7;stroke-width:2;marker-end:url(#head)}</style>
<rect width="1200" height="420" rx="24" fill="#0b172a"/><text x="40" y="60" class="title">Evidence is a replay contract, not a screenshot claim</text>
<text x="40" y="92" class="sub">Every visual is downstream of the same versioned artifact verified by the CLI.</text>
<path d="M172 211 H193" class="arrow"/><path d="M336 211 H357" class="arrow"/><path d="M500 211 H521" class="arrow"/><path d="M664 211 H685" class="arrow"/><path d="M828 211 H849" class="arrow"/><path d="M992 211 H1013" class="arrow"/><g transform="translate(32 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">case.v1</text><text x="18" y="76" class="detail">strict JSON</text><text x="18" y="96" class="detail">digest</text></g><g transform="translate(196 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">rule gate</text><text x="18" y="76" class="detail">typed relation claims</text><text x="18" y="96" class="detail"></text></g><g transform="translate(360 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">BM25</text><text x="18" y="76" class="detail">explicit tokenizer</text><text x="18" y="96" class="detail"></text></g><g transform="translate(524 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">reducer</text><text x="18" y="76" class="detail">ddmin</text><text x="18" y="96" class="detail">proof budget</text></g><g transform="translate(688 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">run.v1</text><text x="18" y="76" class="detail">ranks</text><text x="18" y="96" class="detail">trace</text></g><g transform="translate(852 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">replay</text><text x="18" y="76" class="detail">exact recomputation</text><text x="18" y="96" class="detail"></text></g><g transform="translate(1016 150)"><rect width="140" height="122" rx="18" class="box"/><text x="18" y="46" class="name">report</text><text x="18" y="76" class="detail">offline verified UI</text><text x="18" y="96" class="detail"></text></g>
<text x="40" y="340" class="sub">Offline after installation · no model API · no dataset download · no hidden normalization</text>
</svg>