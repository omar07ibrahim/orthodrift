<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img">
<title>Grapheme-level provenance for every supplied mutation</title>
<desc>The NFD decomposition of Ş is the globally minimal rank-flipping mutation.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#eaf2ff}.title{font-size:30px;font-weight:750}.muted{font-size:14px;fill:#91a8c7}.query{font:700 22px ui-monospace,SFMono-Regular,monospace}.label{font-size:12px;letter-spacing:.13em;text-transform:uppercase;fill:#5ee7f7}.card{fill:#101f35;stroke:#2a3f5e}.chosen{stroke:#ffad5c;stroke-width:3}.number{font-size:14px;font-weight:750;fill:#ffad5c}.rule{font:700 14px ui-monospace,SFMono-Regular,monospace}.code{font:14px ui-monospace,SFMono-Regular,monospace;fill:#5ee7f7}.arrow{font-size:18px;fill:#91a8c7}</style>
<rect width="1200" height="600" rx="24" fill="#0b172a"/>
<text x="52" y="58" class="title">Every character change keeps its provenance</text>
<text x="52" y="91" class="muted">Rules, relation claims, versions, and extended-grapheme coordinates are embedded in the case.</text>
<text x="52" y="142" class="label">baseline query</text><text x="52" y="178" class="query">Şəki atlası 2026</text>
<path d="M52 212 H1148" stroke="#2a3f5e"/><text x="52" y="252" class="label">all mutations applied</text><text x="52" y="288" class="query">ŞəkI atlası 2027</text>
<g transform="translate(52 330)"><rect width="340" height="210" rx="18" class="card chosen"/><text x="22" y="34" class="number">mutation 0 · minimal witness</text><text x="22" y="68" class="rule">unicode.normalize-span.nfd</text><text x="22" y="99" class="muted">canonical · grapheme [0:1]</text><text x="22" y="137" class="code">U+015E</text><text x="22" y="166" class="arrow">↓</text><text x="22" y="195" class="code">U+0053 U+0327</text></g><g transform="translate(430 330)"><rect width="340" height="210" rx="18" class="card"/><text x="22" y="34" class="number">mutation 1</text><text x="22" y="68" class="rule">adversarial.ascii-uppercase</text><text x="22" y="99" class="muted">adversarial · grapheme [3:4]</text><text x="22" y="137" class="code">U+0069</text><text x="22" y="166" class="arrow">↓</text><text x="22" y="195" class="code">U+0049</text></g><g transform="translate(808 330)"><rect width="340" height="210" rx="18" class="card"/><text x="22" y="34" class="number">mutation 2</text><text x="22" y="68" class="rule">adversarial.numeric-shift</text><text x="22" y="99" class="muted">adversarial · grapheme [12:16]</text><text x="22" y="137" class="code">U+0032 U+0030 U+0032 U+0036</text><text x="22" y="166" class="arrow">↓</text><text x="22" y="195" class="code">U+0032 U+0030 U+0032 U+0037</text></g>
</svg>