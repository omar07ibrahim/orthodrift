[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "orthodrift"
dynamic = ["version"]
description = "Minimal counterexamples for orthographic failures in multilingual retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
  { name = "Omar Ibrahim", email = "31526072+omar07ibrahim@users.noreply.github.com" },
]
keywords = ["information-retrieval", "multilingual-nlp", "robustness", "unicode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "regex>=2026.7.19,<2027",
]

[project.urls]
Documentation = "https://github.com/omar07ibrahim/orthodrift#readme"
Issues = "https://github.com/omar07ibrahim/orthodrift/issues"
Repository = "https://github.com/omar07ibrahim/orthodrift"

[project.scripts]
orthodrift = "orthodrift.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "types-regex==2026.7.19.20260720",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orthodrift"]

[tool.hatch.version]
path = "src/orthodrift/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
